<script>
  document.addEventListener("DOMContentLoaded", function() {
    const mermaidCodes = document.querySelectorAll('code.language-mermaid, code.mermaid');
    if (mermaidCodes.length > 0) {
      mermaidCodes.forEach((codeEl) => {
        const pre = codeEl.closest('pre');
        const container = document.createElement('div');
        container.className = 'mermaid';
        container.style.textAlign = 'center';
        container.style.margin = '1.5em 0';
        container.textContent = codeEl.textContent;
        if (pre) {
          pre.parentNode.replaceChild(container, pre);
        } else {
          codeEl.parentNode.replaceChild(container, codeEl);
        }
      });
      mermaid.initialize({ startOnLoad: true, theme: 'default' });
    }

     
    const careerEls = document.querySelectorAll('.career-years');
    if (careerEls.length > 0) {
      const startDate = new Date('2010-09-06T00:00:00+09:00');
      const today = new Date();
      let years = today.getFullYear() - startDate.getFullYear();
      const m = today.getMonth() - startDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < startDate.getDate())) {
        years--;
      }
      careerEls.forEach(function(el) {
        el.textContent = years;
      });
    }
  });
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
