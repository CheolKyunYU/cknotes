baseURL = "https://cknotes.kr/"
defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
title = "CK notes"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true

# PaperMod Search
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "CK notes"
  description = "16년 차 IT 시스템 엔지니어 CK의 실무 인프라(HPE SimpliVity, VME, VMware, Linux, 서버/스토리지) 구축 및 트러블슈팅 경험 기록 노트"
  author = "CK notes"
  DateFormat = "2006-01-02 15:04"
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true

[params.analytics.google]
  SiteVerificationTag = "dr0Q6_PYk2R4JOUSa884LZJjb8hrAqlRxTg5j-XnkgY"

[languages]
  [languages.ko]
    languageName = "KO"
    languageCode = "ko-KR"
    contentDir = "content"
    weight = 1
    title = "CK notes"
    [languages.ko.params]
      homeSubtitle = "16년 차 IT 시스템 엔지니어의 기술 노트"
